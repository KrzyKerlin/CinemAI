<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemAI - Inteligentne Rekomendacje Filmów</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span class="header-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="6" r="1.2"/><circle cx="17" cy="9" r="1.2"/><circle cx="17" cy="15" r="1.2"/><circle cx="12" cy="18" r="1.2"/><circle cx="7" cy="15" r="1.2"/><circle cx="7" cy="9" r="1.2"/></svg></span> CinemAI</h1>
            <p class="subtitle">Odkryj swoje ulubione filmy dzięki inteligentnym rekomendacjom</p>
        </div>
        <div class="search-section">
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Wyszukaj filmy, które chcesz obejrzeć">
            </div>
            <div class="filters">
                <button class="filter-btn active" data-genre="all">Wszystkie</button>
                <button class="filter-btn" data-genre="28">Akcja</button>
                <button class="filter-btn" data-genre="35">Komedia</button>
                <button class="filter-btn" data-genre="18">Dramat</button>
                <button class="filter-btn" data-genre="27">Horror</button>
                <button class="filter-btn" data-genre="878">Sci-Fi</button>
                <button class="filter-btn" data-genre="10749">Romans</button>
                <button class="filter-btn" data-genre="53">Thriller</button>
                <button class="filter-btn" data-genre="99">Dokumentalny</button>
                <button class="filter-btn" data-genre="16">Animacja</button>
                <button class="filter-btn" data-genre="10402">Muzyczny</button>
            </div>
            <div class="saved-container">
                <button class="saved-btn filter-btn" data-genre="saved">
                    <span class="saved-icon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21 12 17 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></span>
                    Zapisane
                </button>
            </div>
        </div>
        <div id="moviesContainer" id="aiSearchBtn">
            <div class="loading">
                <div class="spinner"></div>
                Ładowanie rekomendowanych filmów...
            </div>
        </div>
        <div class="pagination" id="pagination">
            <button id="prevBtn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
            <span class="page-info" id="pageInfo">Strona 1 z 1</span>
            <button id="nextBtn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
        </div>
    </div>
    <div class="footer">
        <p>&copy; 2025 by KK. Wszystkie prawa zastrzeżone.</p>
        <p class="made-for-fun">❤️ Made for fun</p>
        <p class="tmdb-credit">
            Dane pochodzą z <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">The Movie Database (TMDB)</a>
        </p>
    </div>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
