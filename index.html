<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemAI - Inteligentne Rekomendacje Filmów</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span class="header-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="6" r="1.2"/><circle cx="17" cy="9" r="1.2"/><circle cx="17" cy="15" r="1.2"/><circle cx="12" cy="18" r="1.2"/><circle cx="7" cy="15" r="1.2"/><circle cx="7" cy="9" r="1.2"/></svg></span> CinemAI</h1>
            <p class="subtitle">Odkryj swoje ulubione filmy dzięki inteligentnym rekomendacjom</p>
        </div>
        <div class="search-section">
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Wyszukaj filmy, które chcesz obejrzeć">
            </div>
            <div class="filters">
                <button class="filter-btn active" data-genre="all">Wszystkie</button>
                <button class="filter-btn" data-genre="28">
                    <span class="filter-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 11 14 10 22 21 10 13 10 13 2"/></svg></span>
                    <span class="filter-label">Akcja</span>
                </button>
                <button class="filter-btn" data-genre="35">
                    <span class="filter-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></span>
                    <span class="filter-label">Komedia</span>
                </button>
                <button class="filter-btn" data-genre="18">
                    <span class="filter-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 16s1.5-2 4-2 4 2 4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></span>
                    <span class="filter-label">Dramat</span>
                </button>
                <button class="filter-btn" data-genre="27">
                    <span class="filter-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11a8 8 0 0 1 16 0v9l-2.5-2-2.5 2-2.5-2-2.5 2-2.5-2L4 20Z"/><line x1="9" y1="10" x2="9.01" y2="10"/><line x1="15" y1="10" x2="15.01" y2="10"/></svg></span>
                    <span class="filter-label">Horror</span>
                </button>
                <button class="filter-btn" data-genre="878">
                    <span class="filter-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg></span>
                    <span class="filter-label">Sci-Fi</span>
                </button>
                <button class="filter-btn" data-genre="10749">
                    <span class="filter-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></span>
                    <span class="filter-label">Romans</span>
                </button>
                <button class="filter-btn" data-genre="53">
                    <span class="filter-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg></span>
                    <span class="filter-label">Thriller</span>
                </button>
                <button class="filter-btn" data-genre="99">
                    <span class="filter-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></span>
                    <span class="filter-label">Dokumentalny</span>
                </button>
                <button class="filter-btn" data-genre="16">
                    <span class="filter-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8L19 13M15 9h0M17.8 6.2L19 5M3 21l9-9M12.2 6.2L11 5"/></svg></span>
                    <span class="filter-label">Animacja</span>
                </button>
                <button class="filter-btn" data-genre="10402">
                    <span class="filter-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
                    <span class="filter-label">Muzyczny</span>
                </button>
            </div>
            <div class="saved-container">
                <button class="saved-btn filter-btn" data-genre="saved">
                    <span class="saved-icon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21 12 17 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></span>
                    Zapisane
                </button>
            </div>
        </div>
        <div id="moviesContainer" id="aiSearchBtn">
            <div class="loading">
                <div class="spinner"></div>
                Ładowanie rekomendowanych filmów...
            </div>
        </div>
        <div class="pagination" id="pagination">
            <button id="prevBtn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
            <span class="page-info" id="pageInfo">Strona 1 z 1</span>
            <button id="nextBtn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
        </div>
    </div>
    <div class="footer">
        <p>&copy; 2025 by KK. Wszystkie prawa zastrzeżone.</p>
        <p class="made-for-fun">❤️ Made for fun</p>
        <p class="tmdb-credit">
            Dane pochodzą z <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">The Movie Database (TMDB)</a>
        </p>
    </div>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
